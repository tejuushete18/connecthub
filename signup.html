<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | ConnectHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">

                <div class="logo-mark">
                    ♥
                </div>

                <div class="logo-text">
                    Connect<span>Hub</span>
                </div>

            </a>

            <a
                href="login.html"
                class="login-link"
            >
                Already have an account?
            </a>

        </div>

    </header>


    <!-- SIGNUP -->

    <main class="auth-page signup-page">

        <div class="auth-card signup-card">

            <div class="auth-header">

                <div class="auth-icon">
                    ✨
                </div>

                <h1>Create Your Account</h1>

                <p>
                    Join ConnectHub and start discovering
                    new connections.
                </p>

            </div>


            <form
                id="signupForm"
                class="auth-form"
            >

                <div class="form-row">

                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last name"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="birthDate">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="birthDate"
                        required
                    >

                    <small>
                        You must be 18 or older to use ConnectHub.
                    </small>

                </div>


                <div class="form-group">

                    <label>
                        I am interested in
                    </label>

                    <select id="interestPreference" required>

                        <option value="">
                            Select preference
                        </option>

                        <option value="men">
                            Men
                        </option>

                        <option value="women">
                            Women
                        </option>

                        <option value="everyone">
                            Everyone
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="password-input">

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="signupPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <label class="checkbox-label">

                    <input
                        type="checkbox"
                        required
                    >

                    <span>
                        I agree to the Terms & Privacy Policy.
                    </span>

                </label>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
